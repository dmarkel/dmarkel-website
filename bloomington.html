<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#091d22">
    <title>David — Bloomington 2007 Chapter</title>
    <link rel="stylesheet" href="styles.css?v=journey-9">
  </head>
  <body>
    <main class="stage proof-stage" aria-label="Bloomington 2007 Kelley to Memorial Stadium chapter">
      <canvas id="game" aria-label="A pixel character walking from Kelley School of Business to Memorial Stadium"></canvas>

      <header class="masthead">
        <p class="eyebrow">Bloomington · 2007 chapter</p>
      </header>

      <nav class="chapter-nav" aria-label="Chapters">
        <button id="chapter-toggle" type="button" aria-label="Choose a chapter" aria-expanded="false" aria-controls="chapter-panel">
          <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
        </button>
        <div id="chapter-panel" hidden>
          <p class="chapter-menu-title">Jump to chapter</p>
          <div id="chapter-list"></div>
        </div>
      </nav>

      <aside id="instructions" class="instructions" aria-label="Controls">
        <span><kbd>←</kbd><kbd>→</kbd> walk</span>
        <span><kbd>space</kbd> jump</span>
      </aside>

      <div id="status" class="status" role="status" aria-live="polite">Preparing Bloomington…</div>

      <div class="touch-controls" aria-label="Touch controls">
        <button id="joystick" class="joystick" type="button" aria-label="Move left or right">
          <span class="joystick-track" aria-hidden="true"></span>
          <span id="joystick-knob" class="joystick-knob" aria-hidden="true"></span>
        </button>
        <button id="jump-button" class="jump-button" type="button" aria-label="Jump">
          <span aria-hidden="true">↑</span>
          <small>jump</small>
        </button>
      </div>
    </main>
    <script type="module" src="src/bloomington-game.js?v=journey-9"></script>
  </body>
</html>
